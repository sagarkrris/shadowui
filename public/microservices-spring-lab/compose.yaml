name: checkout-lab

x-db: &db
  image: postgres:17
  environment:
    POSTGRES_DB: checkout
    POSTGRES_USER: checkout
    POSTGRES_PASSWORD: lab-only
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U checkout -d checkout"]
    interval: 2s
    timeout: 3s
    retries: 30

x-app: &app
  build: .
  restart: on-failure
  environment: &app-env
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_DATASOURCE_USERNAME: checkout
    SPRING_DATASOURCE_PASSWORD: lab-only

services:
  orders-db:
    <<: *db
    volumes: ["orders-data:/var/lib/postgresql/data"]
  inventory-db:
    <<: *db
    volumes: ["inventory-data:/var/lib/postgresql/data"]
  payment-db:
    <<: *db
    volumes: ["payment-data:/var/lib/postgresql/data"]

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 8s
      retries: 24

  orders:
    <<: *app
    image: checkout-lab-orders:1.0.0
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: orders
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/checkout
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      orders-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
  inventory:
    <<: *app
    image: checkout-lab-inventory:1.0.0
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: inventory
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/checkout
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      inventory-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
  payment:
    <<: *app
    image: checkout-lab-payment:1.0.0
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: payment
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/checkout
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      payment-db: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  orders-data:
  inventory-data:
  payment-data:
  kafka-data:
