micronaut.application.name=micronaut-orders
micronaut.server.host=127.0.0.1
micronaut.server.port=8080
micronaut.server.max-request-size=32KB
micronaut.executors.lab-db.type=fixed
micronaut.executors.lab-db.n-threads=4
datasources.default.driver-class-name=org.h2.Driver
datasources.default.url=jdbc:h2:mem:micronaut-orders
datasources.default.username=sa
datasources.default.password=
datasources.default.maximum-pool-size=4
