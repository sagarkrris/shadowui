name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npx playwright install --with-deps chromium
      - name: Mandatory tech-blog release gate
        run: npm run verify:tech-blog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tech-blog-release-evidence
          path: /tmp/tech-blog-release-*/
